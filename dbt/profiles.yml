online_retail_kimball_dw:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', env_var('POSTGRES_HOST', 'localhost')) }}"
      port: "{{ env_var('DB_PORT', env_var('POSTGRES_PORT', '5432')) | int }}"
      user: "{{ env_var('DB_USER', env_var('POSTGRES_USER', 'dwbi')) }}"
      password: "{{ env_var('DB_PASSWORD', env_var('POSTGRES_PASSWORD', 'dwbi')) }}"
      dbname: "{{ env_var('DB_NAME', env_var('POSTGRES_DB', 'retail_dw')) }}"
      schema: analytics
      threads: 4
      keepalives_idle: 0
