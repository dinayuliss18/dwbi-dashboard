version: 2

sources:
  - name: raw
    schema: raw
    description: Synthetic operational source tables generated by Python Faker and Pandas.
    tables:
      - name: cities
        columns:
          - name: city_id
            tests: [unique, not_null]
      - name: categories
        columns:
          - name: category_id
            tests: [unique, not_null]
      - name: products
        columns:
          - name: product_id
            tests: [unique, not_null]
          - name: category_id
            tests:
              - not_null
              - relationships:
                  arguments:
                  to: source('raw', 'categories')
                  field: category_id
      - name: payment_methods
        columns:
          - name: payment_method_id
            tests: [unique, not_null]
      - name: shipping_services
        columns:
          - name: shipping_service_id
            tests: [unique, not_null]
      - name: vouchers
        columns:
          - name: voucher_id
            tests: [unique, not_null]
      - name: customer_profile_events
        columns:
          - name: customer_profile_event_id
            tests: [unique, not_null]
          - name: customer_id
            tests: [not_null]
          - name: city_id
            tests:
              - not_null
              - relationships:
                  arguments:
                  to: source('raw', 'cities')
                  field: city_id
          - name: operation
            tests:
              - accepted_values:
                  values: ['insert', 'update']
      - name: orders
        columns:
          - name: order_id
            tests: [unique, not_null]
          - name: order_status
            tests:
              - accepted_values:
                  values: ['placed', 'paid', 'packed', 'shipped', 'delivered', 'cancelled', 'returned']
      - name: order_items
        columns:
          - name: order_item_id
            tests: [unique, not_null]
          - name: order_id
            tests:
              - not_null
              - relationships:
                  arguments:
                  to: source('raw', 'orders')
                  field: order_id
      - name: payments
        columns:
          - name: payment_id
            tests: [unique, not_null]
      - name: shipments
        columns:
          - name: shipment_id
            tests: [unique, not_null]
      - name: order_status_events
        columns:
          - name: status_event_id
            tests: [unique, not_null]
