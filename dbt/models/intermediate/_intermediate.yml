version: 2

models:
  - name: int_customer_scd2
    description: Customer Type 2 history generated from raw customer profile events.

    columns:
      - name: customer_key
        tests:
          - unique
          - not_null

      - name: customer_nk
        tests:
          - not_null

      - name: valid_from
        tests:
          - not_null

      - name: valid_to
        tests:
          - not_null

  - name: int_order_item_enriched
    description: Order item staging enriched with order, product, payment, and fulfillment context.

    columns:
      - name: order_item_id
        tests:
          - unique
          - not_null

      - name: total_payment
        tests:
          - not_null

          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"